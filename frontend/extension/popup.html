<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Time Tracker</title>

  <style>
    body {
      background-color: #0f172a;   /* dark blue-black */
      color: #e5e7eb;              /* light text */
      font-family: Arial, sans-serif;
      width: 260px;
      padding: 12px;
    }

    h3 {
      text-align: center;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background: #1e293b;
      margin: 6px 0;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h3>Website Usage</h3>
  <ul id="list"></ul>
  <div id="empty" class="empty" style="display:none;">
    No tracking data yet
  </div>

  <script src="popup.js"></script>
</body>
</html>
